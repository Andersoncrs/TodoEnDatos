project:
  type: website
  output-dir: _site
  resources:
    - CNAME

execute: 
  eval: true
  echo: true
  warning: false
  error: false
  freeze: auto

format:
  html:
    theme:
      - flatly
      - brand
    toc: true
    toc-location: left
    smooth-scroll: true
    code-fold: show
    code-copy: true
    code-overflow: scroll
    df-print: paged
    lightbox:
      match: auto
      effect: zoom
      loop: false
    embed-resources: false
    link-external-newwindow: true
    link-external-icon: true
    include-in-header: analytics.html

website:
  title: "TodoEnDatos"
  site-url: "https://www.todoendatos.com/"
  favicon: images/favicon.svg
  description: "Aprende ciencia de datos y machine learning con TodoEnDatos. Encuentra tutoriales prácticos paso a paso, guías técnicas y proyectos aplicados. "
  search: 
    location: navbar
    type: overlay
    copy-button: true
  comments:
    giscus:
      repo: andersoncrs/todoendatos
      repo-id: R_kgDOTQyDEg
      category: Comentarios Web
      category-id: DIC_kwDOTQyDEs4DC6ZW
      mapping: pathname
      reactions-enabled: true
      input-position: top
      theme: light
      language: es
      loading: lazy

  navbar:
    collapse: true
    left:
      - text: Inicio
        href: index.qmd 
#     - text: acerca de
#        href: about.qmd


lang: es


